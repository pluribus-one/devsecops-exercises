name: SBOM/VEX generation

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sbom-vex-scan:
    name: SBOM/VEX Generation
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        project: [ "webgoat", "juice-shop" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 25
        if: matrix.project == 'webgoat'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          cache-dependency-path: vuln_apps/webgoat/pom.xml

      - name: Populate local Maven repository
        if: matrix.project == 'webgoat'
        working-directory: vuln_apps/webgoat
        run: mvn -B dependency:resolve

      - name: Generate VEXs (Human)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scanners: vuln
          format: table
          output: ${{ matrix.project }}.vex
          scan-ref: ./vuln_apps/${{ matrix.project }}
        env:
          TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db"
          TRIVY_JAVA_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db"

      - name: Run Trivy (SARIF per GitHub Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scanners: vuln
          format: sarif
          output:  ${{ matrix.project }}.sarif
          scan-ref: ./vuln_apps/${{ matrix.project }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: ${{ matrix.project }}.sarif

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vex-${{ matrix.project }}
          path: ${{ matrix.project }}.vex
          retention-days: 5
