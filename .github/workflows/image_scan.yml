name: Images scanner

on:
  workflow_dispatch:

jobs:
  images-security-scan:
    name: Images Scanner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prj_folder: ["webgoat", "juice-shop"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@sha256:de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@sha256:4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Docker Hub
        id: docker-login
        uses: docker/login-action@sha256:4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@sha256:bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: "${{ github.workspace }}/vuln_apps/${{ matrix.prj_folder }}"
          push: false
          load: true
          tags: ${{ matrix.prj_folder }}:latest

      - name: Docker Scout CVEs
        uses: docker/scout-action@sha256:bacf462e8d090c09660de30a6ccc718035f961e3 #v1.0.2
        with:
          command: cves
          image: local://${{ matrix.prj_folder }}:latest
          sarif-file: ${{ matrix.prj_folder }}-cves.json
