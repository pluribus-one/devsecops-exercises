name: Images scanner

on:
  workflow_dispatch:

jobs:
  images-security-scan:
    name: Images Scanner
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        project: ["webgoat", "juice-shop"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        id: docker-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Setup Java 25
        if: matrix.project == 'webgoat'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Compile project
        if: matrix.project == 'webgoat'
        working-directory: vuln_apps/webgoat
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "${{ github.workspace }}/vuln_apps/${{ matrix.project }}"
          push: false
          load: true
          tags: ${{ matrix.project }}:latest

      - name: Docker Scout CVEs
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves
          image: local://${{ matrix.project }}:latest
          sarif-file: ${{ matrix.project }}-cves.json
