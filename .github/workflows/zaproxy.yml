name: Site scanner

on:
  workflow_dispatch:

jobs:
  DAST-scan:
    name: DAST site scanner
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        port: [31546, 31547]

    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          docker_name: zaproxy/zap-stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 # 2.17.0 (20261026)
          target: http://${{ secrets.CLUSTER_IP }}:${{ matrix.port}}
          artifact_name: zap_scan_${{ secrets.CLUSTER_IP }}_${{ matrix.port }}
