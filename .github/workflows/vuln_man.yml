name: SBOM generation

on:
  workflow_dispatch:

jobs:
# Exercise SBOM generation
  sbom:
    name: Generate app SBOM
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ["webgoat", "juice-shop"]
        cdx_spec_version: ["1.5"]
        include:
          - project: webgoat
            cdx_spec_version: "1.5"
            cdx_image: ghcr.io/cyclonedx/cdxgen-java@490fb6842e1e507b7a5051699d1d03b13b87bd1a3b99736ac26c11cbbce9a2bd
          - project: juice-shop
            cdx_spec_version: "1.5"
            cdx_image:  ghcr.io/cyclonedx/cdxgen@41b84d3805940973417b45d9a41c779b5be4a8fcb28a39fdef672f94e6056540

    container:
      image: ${{matrix.cdx_image}}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #V6.0.2
        with:
          submodules: recursive

      - name: Generate SBOMs
        run: |
          cd vuln_apps/${{ matrix.project }}
          cdxgen \
          --format json \
          --spec-version="${{matrix.cdx_spec_version}}" \
          --project-name="${{ matrix.project }}" \
          --project-version="${{ github.run_number }}" \
          -o "${{ matrix.project }}_bom.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{matrix.project}}
          path: "vuln_apps/${{ matrix.project }}/${{ matrix.project }}_bom.json"
          retention-days: 5
          if-no-files-found: error


